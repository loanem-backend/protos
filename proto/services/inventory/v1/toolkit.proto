syntax = "proto3";

package services.inventory.v1;

import "google/protobuf/timestamp.proto";
import "proto/services/inventory/v1/instrument.proto";

option go_package = "github.com/loanem-backend/protos/pb/services/inventory/v1;inventoryv1";

service ToolkitService {
    rpc AddToolkit(AddToolkitRequest) returns (AddToolkitResponse);
    rpc GetAllToolkits(GetAllToolkitsRequest) returns (GetAllToolkitsResponse);
    rpc AddToolkitInstrument(AddToolkitInstrumentRequest) returns (AddToolkitInstrumentResponse);

    rpc SetToolkitCourseID(SetToolkitCourseIDRequest) returns (SetToolkitCourseIDResponse);
    rpc GetToolkitsWithInstruments(GetToolkitsWithInstrumentsRequest) returns (GetToolkitsWithInstrumentsResponse);
    rpc GetToolkitByID(GetToolkitByIDRequest) returns (ToolkitWithInstruments);
}

message AddToolkitRequest {
    string kit_name = 1;
    int32 total_count = 2;
}

message AddToolkitResponse {
    int32 id = 1;
}

message Toolkit {
    int32 id = 1;
    string kit_name = 2;
    int32 course_id = 3;
    int32 total_count = 4;
    int32 out_of_order_count = 5;
    google.protobuf.Timestamp created_at = 6;
    google.protobuf.Timestamp updated_at = 7;
}

message GetAllToolkitsRequest {}

message GetAllToolkitsResponse {
    repeated Toolkit toolkits = 1;
}

message SetToolkitCourseIDRequest {
    int32 toolkit_id = 1;
    int32 course_id = 2;
}

message SetToolkitCourseIDResponse {}

message AddToolkitInstrumentRequest {
    int32 toolkit_id = 1;
    int32 instrument_id = 2;
}

message AddToolkitInstrumentResponse {}

message GetToolkitsWithInstrumentsRequest {}

message ToolkitWithInstruments {
    Toolkit toolkit = 1;
    repeated Instrument instruments = 2;
}

message GetToolkitsWithInstrumentsResponse {
    repeated ToolkitWithInstruments toolkits = 1;
}

message GetToolkitByIDRequest {
    int32 toolkit_id = 1;
}
