syntax = "proto3";

package services.auth.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/loanem-backend/protos/pb/services/auth/v1;authv1";

service AssistantService {
    rpc CreateAssistant(CreateAssistantRequest) returns (CreateAssistantResponse);
    rpc SubmitAssistantPasswordChange(SubmitAssistantPasswordChangeRequest) returns (SubmitAssistantPasswordChangeResponse);
    rpc SetAssistantPassword(SetAssistantPasswordRequest) returns (SetAssistantPasswordResponse);
    rpc GetActiveAssistants(GetActiveAssistantsRequest) returns (GetActiveAssistantsResponse);
    rpc DeleteAssistant(DeleteAssistantRequest) returns (DeleteAssistantResponse);
}

message CreateAssistantRequest {
    string name = 1;
    string phone = 2;
    int32 period = 3;
    string email = 4;
}

message CreateAssistantResponse {
    int32 id = 1;
}

message SubmitAssistantPasswordChangeRequest {
    string old_password = 1;
    string new_password = 2;
    string confirm_password = 3;
}

message SubmitAssistantPasswordChangeResponse {}

message SetAssistantPasswordRequest {
    string change_password_token = 1;
}

message SetAssistantPasswordResponse {}

message GetActiveAssistantsRequest {}

message Assistant {
    int32 id = 1;
    string name = 2;
    string phone = 3;
    bool active = 4;
    int32 period = 5;
    string email = 6;
    google.protobuf.Timestamp created_at = 7;
    google.protobuf.Timestamp updated_at = 8;
}

message GetActiveAssistantsResponse {
    repeated Assistant assistants = 1;
}

message DeleteAssistantRequest {
    int32 id = 1;
}

message DeleteAssistantResponse {}
